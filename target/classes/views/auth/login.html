<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body class="bg-white text-kromaDark antialiased min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-1 max-w-md mx-auto px-4 py-12 w-full">
    <div class="bg-white border border-pink-100 rounded-3xl p-8 shadow-lg space-y-6">
        <div class="text-center space-y-2">
            <span th:classappend="${modoAdmin} ? 'bg-kromaDark text-white' : 'bg-pink-100 text-kromaPink'"
                  th:text="${modoAdmin} ? '🔐 Acceso Exclusivo Administrador' : '✨ Bienvenida a Kroma'"
                  class="inline-block px-3 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-wider"></span>
            <h1 class="text-2xl font-extrabold text-kromaDark" th:text="${modoAdmin} ? 'Portal Administrativo Kroma' : 'Iniciar Sesión'"></h1>
            <p class="text-xs text-gray-500" th:text="${modoAdmin} ? 'Ingresa tus credenciales especiales para gestionar productos e historial de compras.' : 'Accede a tus pedidos, preferencias de tono y garantías.'"></p>
        </div>

        <div th:if="${error != null}" class="p-3.5 rounded-2xl bg-red-50 border border-red-200 text-xs text-red-700 font-semibold" th:text="'⚠️ ' + ${error}"></div>

        <form action="/auth/login" method="POST" class="space-y-4 text-xs">
            <input type="hidden" name="modoAdmin" th:value="${modoAdmin}">
            <input type="hidden" name="nextUrl" th:value="${nextUrl}">

            <div>
                <label class="font-bold text-gray-700 block mb-1">Correo electrónico</label>
                <input type="email" name="correo" required th:placeholder="${modoAdmin ? 'admin@kroma.com.co' : 'tu@correo.com'}" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5 focus:outline-none focus:border-kromaPink">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5 focus:outline-none focus:border-kromaPink">
            </div>

            <button type="submit"
                    th:classappend="${modoAdmin} ? 'bg-kromaDark hover:bg-gray-800 text-white' : 'kroma-btn-primary'"
                    th:text="${modoAdmin} ? 'Ingresar al Panel Admin' : 'Entrar a mi Cuenta'"
                    class="w-full py-3.5 rounded-full font-bold text-sm transition"></button>
        </form>

        <div class="bg-pink-50/70 border border-pink-100 rounded-2xl p-4 text-[11px] text-gray-600 space-y-1">
            <p class="font-extrabold text-kromaDark">Credenciales Demo:</p>
            <div th:if="${modoAdmin}">
                <p><strong>Admin:</strong> <code>admin@kroma.com.co</code> / <code>KromaAdmin2026!</code></p>
                <p class="pt-1"><a href="/auth/login" class="text-kromaPink font-bold hover:underline">← Ir a ingreso de Cliente</a></p>
            </div>
            <div th:if="${!modoAdmin}">
                <p><strong>Cliente:</strong> <code>camila@ejemplo.com.co</code> / <code>Cliente123!</code></p>
                <p class="pt-1 flex justify-between">
                    <a href="/auth/registro" class="text-kromaPink font-bold hover:underline">Crear cuenta nueva</a>
                    <a href="/auth/admin-login" class="text-kromaDark font-bold hover:underline">Soy Administrador →</a>
                </p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
