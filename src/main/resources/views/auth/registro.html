<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body class="bg-white text-kromaDark antialiased min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-1 max-w-lg mx-auto px-4 py-10 w-full">
    <div class="bg-white border border-pink-100 rounded-3xl p-8 shadow-lg space-y-5">
        <div class="text-center space-y-1">
            <span class="inline-block px-3 py-1 rounded-full bg-pink-100 text-kromaPink text-[11px] font-extrabold uppercase">Únete a Kroma Skin-First</span>
            <h1 class="text-2xl font-extrabold text-kromaDark">Crear Cuenta de Cliente</h1>
        </div>

        <div th:if="${error != null}" class="p-3 rounded-2xl bg-red-50 border border-red-200 text-xs text-red-700 font-semibold" th:text="'⚠️ ' + ${error}"></div>

        <form action="/auth/registro" method="POST" class="grid sm:grid-cols-2 gap-3.5 text-xs">
            <div class="sm:col-span-2">
                <label class="font-bold text-gray-700 block mb-1">Nombre completo *</label>
                <input type="text" name="nombre" required class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1">Correo electrónico *</label>
                <input type="email" name="correo" required class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1">Contraseña (mín. 6) *</label>
                <input type="password" name="password" required minlength="6" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1">Cédula</label>
                <input type="text" name="cedula" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1">Teléfono</label>
                <input type="text" name="telefono" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div class="sm:col-span-2">
                <label class="font-bold text-gray-700 block mb-1">Dirección en Colombia</label>
                <input type="text" name="direccion" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1">Ciudad</label>
                <input type="text" name="ciudad" value="Bogotá" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1">Departamento</label>
                <input type="text" name="departamento" value="Cundinamarca" class="w-full rounded-xl border border-pink-200 px-3.5 py-2.5">
            </div>
            <div class="sm:col-span-2 pt-2">
                <button type="submit" class="w-full py-3.5 rounded-full kroma-btn-primary font-bold text-sm">Registrarme en Kroma</button>
            </div>
        </form>
        <p class="text-center text-xs text-gray-500">¿Ya tienes cuenta? <a href="/auth/login" class="text-kromaPink font-bold hover:underline">Inicia sesión aquí</a></p>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
